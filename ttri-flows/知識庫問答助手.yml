    - data:
        desc: 由 LLM 判斷 API 答案是否符合題意，並產生補救方案。
        instruction: '請根據輸入內容評估 API 答案品質，只回傳參數，不要直接回答使用者。

          評估規則：

          - quality_grade 只能是 good、partial、poor。

          - good：答案直接回應使用者題意，且有引用或使用證據支撐，沒有重大限制。

          - partial：答案部分回應題意，但缺少專案名稱、章節、證據不足、限制明顯，或只回答到相鄰問題。

          - poor：API 失敗、沒有答案、沒有證據、答非所問，或無法判斷是否來自政府專案技術報告。

