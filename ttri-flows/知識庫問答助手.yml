          \   query: str,\n    api_ok: bool,\n    answer: str,\n    citations_summary:\
          \ str,\n    used_evidence_summary: str,\n    limitations_summary: str,\n\
          \    confidence_text: str,\n    retrieval_mode: str,\n    context: str,\n\
          \    api_summary: str,\n) -> dict:\n    parts = [\n        _section(\"使用者問題\"\
          , query),\n        _section(\"API 狀態\", f\"api_ok={api_ok}\\n{api_summary}\"\
          ),\n        _section(\"API 答案\", answer),\n        _section(\"引用\", citations_summary),\n\
