    - data:
        code: "import json\n\n\ndef _text(value):\n    if value is None:\n       \
          \ return \"\"\n    return str(value).strip()\n\n\ndef _loads(raw):\n   \
          \ if isinstance(raw, dict):\n        return raw\n    if raw is None:\n \
          \       return {}\n    try:\n        return json.loads(str(raw))\n    except\
          \ Exception:\n        return {}\n\n\ndef _citation_label(item, index):\n\
          \    if not isinstance(item, dict):\n        return f\"{index}. 無法解析的引用\"\
          \n    refs = item.get(\"source_refs\") or []\n    ref_text = \"\"\n    if\
          \ refs and isinstance(refs[0], dict):\n        source_id = refs[0].get(\"\
          source_id\") or refs[0].get(\"id\") or refs[0].get(\"title\") or \"\"\n\
          \        source_type = refs[0].get(\"source_type\") or refs[0].get(\"type\"\
          ) or \"\"\n        ref_text = f\"，source_refs={source_type}:{source_id}\"\
          .strip(\"，\")\n    return (\n        f\"{index}. documentKey={_text(item.get('documentKey'))\
          \ or '-'}，\"\n        f\"chunkKey={_text(item.get('chunkKey')) or '-'}，\"\
          \n        f\"method={_text(item.get('retrievalMethod')) or '-'}，\"\n   \
          \     f\"score={item.get('score', '-')}{('，' + ref_text) if ref_text else\
          \ ''}\"\n    )\n\n\ndef main(status_code: int, body: str) -> dict:\n   \
          \ raw_json = body if isinstance(body, str) else json.dumps(body, ensure_ascii=False)\n\
          \    try:\n        status = int(status_code)\n    except Exception:\n  \
          \      status = 0\n\n    if status == 401:\n        return {\n         \
          \   \"api_ok\": False,\n            \"answer\": \"\",\n            \"citations_summary\"\
          : \"\",\n            \"used_evidence_summary\": \"\",\n            \"limitations_summary\"\
          : \"GraphRAG Query API 驗證失敗，請確認 Bearer token。\",\n            \"confidence_text\"\
          : \"\",\n            \"context\": \"\",\n            \"retrieval_mode\"\
          : \"\",\n            \"raw_json\": raw_json,\n            \"summary\": \"\
          GraphRAG Query API 驗證失敗，請確認 GRAPHRAG_QUERY_API_TOKEN。\",\n        }\n  \
          \  if status == 403:\n        return {\n            \"api_ok\": False,\n\
          \            \"answer\": \"\",\n            \"citations_summary\": \"\"\
          ,\n            \"used_evidence_summary\": \"\",\n            \"limitations_summary\"\
          : \"GraphRAG Query API 拒絕存取，請確認使用者上下文或服務授權設定。\",\n            \"confidence_text\"\
          : \"\",\n            \"context\": \"\",\n            \"retrieval_mode\"\
          : \"\",\n            \"raw_json\": raw_json,\n            \"summary\": \"\
          GraphRAG Query API 拒絕存取，請確認服務授權設定。\",\n        }\n    if status == 422:\n\
          \        return {\n            \"api_ok\": False,\n            \"answer\"\
          : \"\",\n            \"citations_summary\": \"\",\n            \"used_evidence_summary\"\
          : \"\",\n            \"limitations_summary\": \"GraphRAG Query API 參數驗證失敗。\"\
          ,\n            \"confidence_text\": \"\",\n            \"context\": \"\"\
          ,\n            \"retrieval_mode\": \"\",\n            \"raw_json\": raw_json,\n\
          \            \"summary\": \"GraphRAG Query API 參數驗證失敗，請確認 /answer request\
          \ contract。\",\n        }\n    if status != 200:\n        return {\n   \
          \         \"api_ok\": False,\n            \"answer\": \"\",\n          \
          \  \"citations_summary\": \"\",\n            \"used_evidence_summary\":\
          \ \"\",\n            \"limitations_summary\": f\"GraphRAG Query API 回應失敗（HTTP\
          \ {status}）。\",\n            \"confidence_text\": \"\",\n            \"\
          context\": \"\",\n            \"retrieval_mode\": \"\",\n            \"\
          raw_json\": raw_json,\n            \"summary\": f\"GraphRAG Query API 回應失敗（HTTP\
          \ {status}）。\",\n        }\n\n    payload = _loads(raw_json)\n    if not\
          \ payload:\n        return {\n            \"api_ok\": False,\n         \
          \   \"answer\": \"\",\n            \"citations_summary\": \"\",\n      \
          \      \"used_evidence_summary\": \"\",\n            \"limitations_summary\"\
          : \"GraphRAG Query API 回傳內容不是有效 JSON。\",\n            \"confidence_text\"\
          : \"\",\n            \"context\": \"\",\n            \"retrieval_mode\"\
          : \"\",\n            \"raw_json\": raw_json,\n            \"summary\": \"\
          GraphRAG Query API 回傳內容不是有效 JSON。\",\n        }\n\n    citations = payload.get(\"\
          citations\") or []\n    used_evidence = payload.get(\"usedEvidence\") or\
          \ []\n    limitations = payload.get(\"limitations\") or []\n    answer =\
          \ _text(payload.get(\"answer\"))\n    confidence = payload.get(\"confidence\"\
          )\n    context = _text(payload.get(\"context\"))\n    retrieval_mode = _text(payload.get(\"\
          retrievalMode\"))\n\n    citations_summary = \"\\n\".join(\n        _citation_label(item,\
          \ index) for index, item in enumerate(citations[:8], start=1)\n    )\n \
          \   used_evidence_summary = \"\\n\".join(\n        _citation_label(item,\
          \ index) for index, item in enumerate(used_evidence[:8], start=1)\n    )\n\
          \    limitations_summary = \"\\n\".join(f\"- {_text(item)}\" for item in\
          \ limitations if _text(item))\n    confidence_text = \"\" if confidence\
          \ is None else str(confidence)\n\n    if not answer:\n        summary =\
          \ \"GraphRAG Query API 未產生答案。\"\n    elif not citations and not used_evidence:\n\
          \        summary = \"GraphRAG Query API 已回覆，但沒有可用引用或證據。\"\n    else:\n \
          \       summary = \"GraphRAG Query API 已回覆並提供證據。\"\n\n    return {\n   \
          \     \"api_ok\": True,\n        \"answer\": answer,\n        \"citations_summary\"\
          : citations_summary,\n        \"used_evidence_summary\": used_evidence_summary,\n\
          \        \"limitations_summary\": limitations_summary,\n        \"confidence_text\"\
          : confidence_text,\n        \"context\": context[:6000],\n        \"retrieval_mode\"\
          : retrieval_mode,\n        \"raw_json\": raw_json,\n        \"summary\"\
          : summary,\n    }\n"
