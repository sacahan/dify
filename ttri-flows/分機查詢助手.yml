    - data:
        desc: 從自然語言抽出查詢方向、姓名與分機。
        instruction: '請從使用者問題抽取同仁通訊錄查詢條件，只回傳參數，不要回答問題。

          判斷規則：

          - 使用者提供姓名、想查分機或電話時，query_direction = name_to_extension。

          - 使用者提供分機號碼、想知道是誰或哪位同仁時，query_direction = extension_to_name。

          - 使用者只是在問這個工具怎麼用時，query_direction = clarification。

          - 不是同仁姓名/分機查詢時，query_direction = unsupported。

          抽取規則：

          - employee_name 只放同仁姓名，不要放「同仁」、「分機」、「電話」等普通詞。

          - extension_number 只放數字，移除空白、#、分機等文字。

          - 不確定的欄位請回傳空字串，不要猜。'
        memory: null
        model:
          completion_params:
            temperature: 0
          mode: chat
          name: google/gemma-4-E4B-it
          provider: langgenius/openai_api_compatible/openai_api_compatible
        parameters:
        - description: 查詢方向，只能是 name_to_extension、extension_to_name、clarification、unsupported
            或空字串。
          name: query_direction
          required: false
          type: string
        - description: 使用者指定的同仁姓名；若沒有姓名請回傳空字串。
