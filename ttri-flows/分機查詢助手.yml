    - data:
        code: "import re\n\n\nVALID_DIRECTIONS = {'name_to_extension', 'extension_to_name',\
          \ 'clarification', 'unsupported'}\n\n\ndef _clean(value):\n    if value\
          \ is None:\n        return ''\n    return str(value).strip()\n\n\ndef _clean_name(value):\n\
          \    text = _clean(value)\n    for word in ['同仁', '員工', '姓名', '名字', '分機',\
          \ '電話', '請問', '幫我查', '查詢']:\n        text = text.replace(word, '')\n   \
          \ return text.strip(' ：:，,。?？')\n\n\ndef _clean_extension(value):\n    return\
          \ ''.join(re.findall(r'\\d+', _clean(value)))\n\n\ndef _extension_from_query(query):\n\
          \    text = _clean(query)\n    match = re.search(r'(?:分機|ext\\.?|extension|電話)?\\\
          s*#?\\s*(\\d{3,6})', text, flags=re.IGNORECASE)\n    return match.group(1)\
          \ if match else ''\n\n\ndef _name_from_query(query):\n    text = _clean(query)\n\
          \    text = re.sub(r'\\d{3,6}', '', text)\n    for word in ['的分機是多少', '分機是多少',\
          \ '分機是什麼', '電話是多少', '電話是什麼', '分機', '電話', '請問', '幫我查', '查詢', '是多少', '是什麼']:\n\
          \        text = text.replace(word, '')\n    return text.strip(' ：:，,。?？')\n\
          \n\ndef _direction_from_query(query, direction, employee_name, extension_number):\n\
          \    normalized = _clean(direction)\n    if normalized in VALID_DIRECTIONS:\n\
          \        return normalized\n    text = _clean(query)\n    if extension_number\
          \ or re.search(r'\\d{3,6}', text):\n        return 'extension_to_name'\n\
          \    if employee_name or any(word in text for word in ['分機', '電話']):\n \
          \       return 'name_to_extension'\n    if any(word in text for word in\
          \ ['怎麼查', '怎麼用', '可以查什麼']):\n        return 'clarification'\n    return\
          \ 'unsupported'\n\n\ndef main(query: str, query_direction: str, employee_name:\
          \ str, extension_number: str) -> dict:\n    name = _clean_name(employee_name)\n\
          \    extension = _clean_extension(extension_number)\n\n    if not extension:\n\
          \        extension = _extension_from_query(query)\n    if not name:\n  \
          \      name = _name_from_query(query)\n\n    direction = _direction_from_query(query,\
          \ query_direction, name, extension)\n\n    if direction == 'extension_to_name':\n\
          \        lookup_value = extension\n        retrieval_query = f'分機 {extension}\
          \ 姓名 同仁'\n        needs_clarification = not bool(extension)\n        summary\
          \ = '請提供要反查的分機號碼，例如「分機 5678 是誰？」。'\n    elif direction == 'name_to_extension':\n\
          \        lookup_value = name\n        retrieval_query = f'{name} 分機 電話'\n\
          \        needs_clarification = not bool(name)\n        summary = '請提供要查詢的同仁姓名，例如「王小明的分機是多少？」。'\n\
          \    elif direction == 'clarification':\n        lookup_value = ''\n   \
          \     retrieval_query = ''\n        needs_clarification = True\n       \
          \ summary = '可以直接用自然語言查詢，例如「王小明的分機是多少？」或「分機 5678 是誰？」。'\n    else:\n   \
          \     lookup_value = ''\n        retrieval_query = ''\n        needs_clarification\
          \ = True\n        summary = '這個工作流目前只支援同仁姓名查分機，或用分機反查同仁姓名。'\n\n    return\
          \ {\n        'query_direction': direction,\n        'employee_name': name,\n\
          \        'extension_number': extension,\n        'lookup_value': lookup_value,\n\
          \        'retrieval_query': retrieval_query,\n        'needs_clarification':\
          \ needs_clarification,\n        'summary': summary,\n    }\n"
        code_language: python3
        desc: 正規化抽取結果，補強分機 regex，並產生知識庫查詢字串。
