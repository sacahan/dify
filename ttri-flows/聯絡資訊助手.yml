    nodes:
    - data:
        desc: 請輸入你要查詢的同仁聯絡資訊，例如「王小明的分機是多少？」、「王小明的 Email 是什麼？」或「資訊處有哪些同仁？」。
        selected: false
        title: Start
        type: start
        variables:
        - default: ''
          hint: 可輸入姓名、分機、員編、Email、部門或完整問題，例如：王小明的 Email 是什麼？
          label: 查詢同仁聯絡資訊
          max_length: 256
          options: []
          placeholder: 王小明的 Email 是什麼？
          required: true
          type: text-input
          variable: query
      height: 187
      id: start
      position:
        x: 0
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        desc: 從自然語言抽出查詢方向、姓名、分機與 Employee Directory API 條件。
        instruction: '請從使用者問題抽取同仁聯絡資訊查詢條件，只回傳參數，不要回答問題。

          判斷規則：

          - 使用者提供姓名、想查分機或電話時，query_direction = name_to_extension。

          - 「王小明分機」、「王小明的分機」、「查王小明分機」都代表用姓名查分機，query_direction = name_to_extension。

          - 使用者提供分機號碼、想知道是誰或哪位同仁時，query_direction = extension_to_name。

          - 只有出現 3 到 6 位數字分機，例如「分機 5678 是誰？」時，才判斷為 extension_to_name。

          - 使用者想查 Email、電子郵件、部門、員編、員工編號、帳號、同仁資料、聯絡資訊或某部門同仁清單時，query_direction = employee_info。

          - 使用者只是在問這個工具怎麼用時，query_direction = clarification。

          - 不是同仁聯絡資訊查詢時，query_direction = unsupported。

          抽取規則：

          - employee_name 只放同仁姓名，不要放「同仁」、「分機」、「電話」等普通詞。

          - extension_number 只放數字，移除空白、#、分機等文字。

          - employee_id 只放員編或員工編號，不要放「員編」兩字。

          - email 只放 Email 或 Email 片段。

          - department 只放部門名稱，不要放「有哪些同仁」、「查詢」等普通詞。

          - requested_fields 用逗號列出使用者要查的欄位，例如 email,department,employeeId,employeeAccount,name；若只是要完整同仁資料，填
          all。

          - 職編等於員編，職工編號等於員工編號。

          - 不確定的欄位請回傳空字串，不要猜。'
        memory: null
        model:
          completion_params:
            temperature: 0
          mode: chat
          name: google/gemma-4-E4B-it
          provider: langgenius/openai_api_compatible/openai_api_compatible
        parameters:
        - description: 查詢方向，只能是 name_to_extension、extension_to_name、employee_info、clarification、unsupported
            或空字串。
          name: query_direction
          required: false
          type: string
        - description: 使用者指定的同仁姓名；若沒有姓名請回傳空字串。
          name: employee_name
          required: false
          type: string
        - description: 使用者指定的分機號碼；只保留數字，若沒有分機請回傳空字串。
          name: extension_number
          required: false
          type: string
        - description: 使用者指定的員編或員工編號；若沒有員編請回傳空字串。
          name: employee_id
          required: false
          type: string
        - description: 使用者指定的 Email 或 Email 片段；若沒有 Email 請回傳空字串。
          name: email
          required: false
          type: string
        - description: 使用者指定的部門名稱；若沒有部門請回傳空字串。
          name: department
          required: false
          type: string
        - description: 使用者想看的欄位，以逗號分隔，例如 email,department；若不確定請回傳空字串。
          name: requested_fields
          required: false
          type: string
        query:
        - start
        - query
        reasoning_mode: function_call
        selected: false
        title: 抽取查詢參數
        type: parameter-extractor
        vision:
          enabled: false
      height: 131
      id: extract_lookup_parameters
      position:
        x: 342
        y: 59.166666666666686
      positionAbsolute:
        x: 342
        y: 59.166666666666686
      selected: true
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "import re\nfrom urllib.parse import quote\n\n\nVALID_DIRECTIONS = {'name_to_extension',\
          \ 'extension_to_name', 'employee_info', 'clarification', 'unsupported'}\n\
          \n\ndef _clean(value):\n    if value is None:\n        return ''\n    return\
          \ str(value).strip()\n\n\ndef _strip_words(text, words):\n    for word in\
          \ words:\n        text = text.replace(word, '')\n    return text.strip('\
          \ 的：:，,。?？')\n\n\ndef _clean_name(value):\n    return _strip_words(_clean(value),\
          \ [\n        '同仁', '員工', '姓名', '名字', '分機', '電話', 'email', 'Email', '電子郵件',\n\
          \        '部門', '單位', '員編', '員工編號', '帳號', '聯絡資訊', '同仁資料', '請問', '幫我查', '查詢',\n\
          \    ])\n\n\ndef _clean_extension(value):\n    return ''.join(re.findall(r'\\\
          d+', _clean(value)))\n\n\ndef _extension_from_query(query):\n    text =\
          \ _clean(query)\n    match = re.search(r'(?:分機|ext\\.?|extension|電話)\\s*#?\\\
          s*(\\d{3,6})', text, flags=re.IGNORECASE)\n    return match.group(1) if\
          \ match else ''\n\n\ndef _employee_id_from_query(query):\n    text = _clean(query)\n\
          \    match = re.search(r'(?:員編|員工編號|employee\\s*id)\\s*[:：#]?\\s*([A-Za-z0-9._-]{1,64})',\
          \ text, flags=re.IGNORECASE)\n    return match.group(1) if match else ''\n\
          \n\ndef _email_from_query(query):\n    text = _clean(query)\n    match =\
          \ re.search(r'[\\w.+-]+@[\\w.-]+', text)\n    return match.group(0) if match\
          \ else ''\n\n\ndef _department_from_query(query):\n    text = _clean(query)\n\
          \    match = re.search(r'([\\u4e00-\\u9fffA-Za-z0-9_-]{2,32}(?:處|部|組|科|室|中心|課))',\
          \ text)\n    return match.group(1) if match else ''\n\n\ndef _name_from_query(query):\n\
          \    text = _clean(query)\n    text = re.sub(r'\\d{3,6}', '', text)\n  \
          \  text = re.sub(r'[\\w.+-]+@[\\w.-]+', '', text)\n    return _strip_words(text,\
          \ [\n        '的分機是多少', '分機是多少', '分機是什麼', '電話是多少', '電話是什麼',\n        '的Email是什麼',\
          \ 'Email是什麼', 'email是什麼', '電子郵件是什麼',\n        '在哪個部門', '是哪個部門', '部門是什麼',\
          \ '員編是多少', '帳號是什麼',\n        '有哪些同仁', '同仁清單', '聯絡資訊', '同仁資料', '分機', '電話',\
          \ 'Email',\n        'email', '電子郵件', '部門', '單位', '員編', '員工編號', '帳號',\n \
          \       '請問', '幫我查', '查詢', '是多少', '是什麼',\n    ])\n\n\ndef _requested_fields(query,\
          \ requested_fields):\n    normalized = _clean(requested_fields)\n    if\
          \ normalized:\n        return normalized\n    text = _clean(query)\n   \
          \ fields = []\n    if any(word in text for word in ['Email', 'email', '電子郵件',\
          \ '信箱']):\n        fields.append('email')\n    if any(word in text for word\
          \ in ['部門', '單位']):\n        fields.append('department')\n    if any(word\
          \ in text for word in ['員編', '員工編號']):\n        fields.append('employeeId')\n\
          \    if '帳號' in text:\n        fields.append('employeeAccount')\n    if\
          \ any(word in text for word in ['聯絡資訊', '同仁資料', '完整資料']):\n        fields.append('all')\n\
          \    return ','.join(fields)\n\n\ndef _direction_from_query(query, direction,\
          \ employee_name, extension_number, employee_id, email, department):\n  \
          \  normalized = _clean(direction)\n    text = _clean(query)\n    has_extension_number\
          \ = bool(extension_number) or bool(re.search(r'(?:分機|ext\\.?|extension|電話)\\\
          s*#?\\s*\\d{3,6}', text, flags=re.IGNORECASE))\n    asks_for_extension =\
          \ any(word in text for word in ['分機', '電話', 'ext', 'extension'])\n    has_name\
          \ = bool(employee_name) and employee_name not in {'誰', '哪位', '哪一位', '哪個人'}\n\
          \n    if normalized != 'unsupported' and has_name and asks_for_extension\
          \ and not has_extension_number:\n        return 'name_to_extension'\n  \
          \  if normalized in VALID_DIRECTIONS:\n        return normalized\n    if\
          \ any(word in text for word in ['怎麼查', '怎麼用', '可以查什麼']):\n        return\
          \ 'clarification'\n    if employee_id or email or department or any(word\
          \ in text for word in ['Email', 'email', '電子郵件', '部門', '單位', '員編', '員工編號',\
          \ '帳號', '聯絡資訊', '同仁資料']):\n        return 'employee_info'\n    if has_extension_number:\n\
          \        return 'extension_to_name'\n    if employee_name or asks_for_extension:\n\
          \        return 'name_to_extension'\n    return 'unsupported'\n\n\ndef _api_path(employee_id,\
          \ employee_name, email, department):\n    if employee_id:\n        return\
          \ f'/v1/employees/{quote(employee_id)}'\n    params = []\n    if employee_name:\n\
          \        params.append(f'name={quote(employee_name)}')\n    if email:\n\
          \        params.append(f'email={quote(email)}')\n    if department:\n  \
          \      params.append(f'department={quote(department)}')\n    params.append('limit=10')\n\
          \    return '/v1/employees/search?' + '&'.join(params)\n\n\ndef main(query:\
          \ str, query_direction: str, employee_name: str, extension_number: str,\
          \ employee_id: str, email: str, department: str, requested_fields: str)\
          \ -> dict:\n    name = _clean_name(employee_name)\n    extension = _clean_extension(extension_number)\n\
          \    emp_id = _clean(employee_id) or _employee_id_from_query(query)\n  \
          \  mail = _clean(email) or _email_from_query(query)\n    dept = _clean(department)\
          \ or _department_from_query(query)\n    fields = _requested_fields(query,\
          \ requested_fields)\n\n    if not extension:\n        extension = _extension_from_query(query)\n\
          \    if not name and not dept:\n        name = _name_from_query(query)\n\
          \n    direction = _direction_from_query(query, query_direction, name, extension,\
          \ emp_id, mail, dept)\n    uses_employee_api = direction == 'employee_info'\n\
          \n    if direction == 'extension_to_name':\n        lookup_value = extension\n\
          \        retrieval_query = f'分機 {extension} 姓名 同仁'\n        api_path_and_query\
          \ = ''\n        needs_clarification = not bool(extension)\n        summary\
          \ = '請提供要反查的分機號碼，例如「分機 5678 是誰？」。'\n    elif direction == 'name_to_extension':\n\
          \        lookup_value = name\n        retrieval_query = f'{name} 分機 電話'\n\
          \        api_path_and_query = ''\n        needs_clarification = not bool(name)\n\
          \        summary = '請提供要查詢的同仁姓名，例如「王小明的分機是多少？」。'\n    elif direction ==\
          \ 'employee_info':\n        lookup_value = emp_id or name or mail or dept\n\
          \        retrieval_query = ''\n        api_path_and_query = _api_path(emp_id,\
          \ name, mail, dept)\n        needs_clarification = not bool(emp_id or name\
          \ or mail or dept)\n        summary = '請提供姓名、員編、Email 或部門，例如「王小明的 Email\
          \ 是什麼？」或「資訊處有哪些同仁？」。'\n    elif direction == 'clarification':\n        lookup_value\
          \ = ''\n        retrieval_query = ''\n        api_path_and_query = ''\n\
          \        needs_clarification = True\n        summary = '可以直接用自然語言查詢，例如「王小明的分機是多少？」、「王小明的\
          \ Email 是什麼？」或「資訊處有哪些同仁？」。'\n    else:\n        lookup_value = ''\n    \
          \    retrieval_query = ''\n        api_path_and_query = ''\n        needs_clarification\
          \ = True\n        summary = '這個工作流目前支援同仁分機、姓名、員編、帳號、Email 與部門查詢。'\n\n  \
          \  return {\n        'query_direction': direction,\n        'employee_name':\
          \ name,\n        'extension_number': extension,\n        'employee_id':\
          \ emp_id,\n        'email': mail,\n        'department': dept,\n       \
          \ 'requested_fields': fields,\n        'lookup_value': lookup_value,\n \
          \       'retrieval_query': retrieval_query,\n        'uses_employee_api':\
          \ uses_employee_api,\n        'needs_clarification': needs_clarification,\n\
          \        'summary': summary,\n    }\n"
        code_language: python3
        desc: 正規化抽取結果，補強分機/API 條件，並決定查詢資料來源。
        outputs:
          department:
            children: null
