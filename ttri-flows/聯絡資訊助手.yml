          \    dept = _clean(department)\n    uses_employee_id_endpoint = bool(emp_id\
          \ and not name and not mail and not dept)\n\n    params = []\n    if emp_id\
          \ and not uses_employee_id_endpoint:\n        params.append(f'employeeId={quote(emp_id)}')\n\
          \    if name:\n        params.append(f'name={quote(name)}')\n    if mail:\n\
          \        params.append(f'email={quote(mail)}')\n    if dept:\n        params.append(f'department={quote(dept)}')\n\
          \    params.append('limit=10')\n\n    return {\n        'uses_employee_id_endpoint':\
          \ uses_employee_id_endpoint,\n        'employee_id_path': quote(emp_id),\n\
          \        'employee_search_query': '&'.join(params),\n    }\n"
