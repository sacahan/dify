          \ return '-'\n    text = str(value).strip()\n    return text if text else\
          \ '-'\n\n\ndef _wanted_fields(requested_fields):\n    fields = [field.strip()\
          \ for field in _text(requested_fields).split(',') if field.strip() and field.strip()\
          \ != '-']\n    return set(fields)\n\n\ndef _employee_lines(employee, wanted):\n\
          \    field_map = [\n        ('姓名', 'name', 'name'),\n        ('員編', 'employeeId',\
          \ 'employeeId'),\n        ('帳號', 'employeeAccount', 'employeeAccount'),\n\
          \        ('Email', 'email', 'email'),\n        ('部門', 'department', 'department'),\n\
          \    ]\n    show_all = not wanted or 'all' in wanted\n    lines = []\n \
          \   for label, key, token in field_map:\n        if show_all or token in\
          \ wanted:\n            lines.append(f'- {label}：{_text(employee.get(key))}')\n\
          \    return lines\n\n\ndef main(status_code: int, body: str, requested_fields:\
          \ str, lookup_value: str) -> dict:\n    raw_json = body if isinstance(body,\
          \ str) else json.dumps(body, ensure_ascii=False)\n    try:\n        status\
          \ = int(status_code)\n    except Exception:\n        status = 0\n\n    if\
          \ status == 404:\n        return {'summary': '查不到符合的同仁資料。', 'result_count':\
          \ 0, 'raw_json': raw_json}\n    if status == 401:\n        return {'summary':\
          \ '同仁資料 API 驗證失敗，請確認 Bearer token。', 'result_count': 0, 'raw_json': raw_json}\n\
          \    if status != 200:\n        return {'summary': f'同仁資料 API 回應失敗（HTTP\
          \ {status}）。', 'result_count': 0, 'raw_json': raw_json}\n\n    try:\n  \
          \      payload = json.loads(raw_json)\n    except Exception:\n        return\
          \ {'summary': '同仁資料 API 回傳內容不是有效 JSON。', 'result_count': 0, 'raw_json':\
          \ raw_json}\n\n    if not isinstance(payload, dict):\n        return {'summary':\
          \ '同仁資料 API 回傳內容不是同仁物件。', 'result_count': 0, 'raw_json': raw_json}\n\n \
          \   wanted = _wanted_fields(requested_fields)\n    lines = [\n        '##\
          \ 同仁資料查詢結果',\n        f'- API：GET /v1/employees/{{employee_id}}',\n    \
          \    f'- 查詢值：{_text(lookup_value)}',\n        '- 符合筆數：1',\n        '',\n\
          \    ]\n    lines.extend(_employee_lines(payload, wanted))\n    return {'summary':\
          \ '\\n'.join(lines).strip(), 'result_count': 1, 'raw_json': raw_json}\n"
