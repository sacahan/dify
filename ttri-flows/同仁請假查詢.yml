    - data:
        code: "from datetime import datetime, timedelta, timezone\nimport re\n\n\n\
          def _clean(value):\n    if value is None:\n        return ''\n    return\
          \ str(value).strip()\n\n\ndef _valid_date(value):\n    text = _clean(value)\n\
          \    if not re.fullmatch(r'\\d{4}-\\d{2}-\\d{2}', text):\n        return\
          \ ''\n    try:\n        datetime.strptime(text, '%Y-%m-%d')\n        return\
          \ text\n    except Exception:\n        return ''\n\n\ndef _relative_date(query,\
          \ relative_date):\n    text = (_clean(relative_date) or '').lower()\n  \
          \  if text in {'today', 'tomorrow', 'day_after_tomorrow', 'yesterday'}:\n\
          \        return text\n    query_text = _clean(query)\n    if '後天' in query_text:\n\
          \        return 'day_after_tomorrow'\n    if '明天' in query_text or '明日'\
          \ in query_text:\n        return 'tomorrow'\n    if '昨天' in query_text or\
          \ '昨日' in query_text:\n        return 'yesterday'\n    if '今天' in query_text\
          \ or '今日' in query_text:\n        return 'today'\n    return ''\n\n\ndef\
          \ _date_from_relative(relative_date):\n    today = datetime.now(timezone(timedelta(hours=8))).date()\n\
          \    offsets = {\n        'yesterday': -1,\n        'today': 0,\n      \
          \  'tomorrow': 1,\n        'day_after_tomorrow': 2,\n    }\n    if relative_date\
          \ not in offsets:\n        return ''\n    return (today + timedelta(days=offsets[relative_date])).isoformat()\n\
          \n\ndef _date_from_query(query):\n    match = re.search(r'(20\\d{2})[-/](\\\
          d{1,2})[-/](\\d{1,2})', _clean(query))\n    if not match:\n        return\
          \ ''\n    year, month, day = match.groups()\n    try:\n        return datetime(int(year),\
          \ int(month), int(day)).date().isoformat()\n    except Exception:\n    \
          \    return ''\n\n\ndef main(query: str, from_date: str, to_date: str, relative_date:\
          \ str, target_person: str) -> dict:\n    normalized_relative = _relative_date(query,\
          \ relative_date)\n    relative_resolved_date = _date_from_relative(normalized_relative)\n\
          \    explicit_query_date = _date_from_query(query)\n\n    start_date = _valid_date(from_date)\
          \ or relative_resolved_date or explicit_query_date\n    end_date = _valid_date(to_date)\
          \ or start_date\n    person = _clean(target_person)\n\n    needs_clarification\
          \ = not bool(start_date and end_date)\n    if needs_clarification:\n   \
          \     summary = '請告訴我要查詢哪一天或日期區間，例如「查明天有誰請假」或「查 2026-05-21 有誰請假」。'\n   \
          \ else:\n        target_text = person if person else '所有同仁'\n        summary\
          \ = f'已判斷查詢條件：{start_date} 至 {end_date}，查詢對象：{target_text}。'\n\n    return\
          \ {\n        'from_date': start_date,\n        'to_date': end_date,\n  \
          \      'target_person': person,\n        'relative_date': normalized_relative,\n\
          \        'needs_clarification': needs_clarification,\n        'summary':\
          \ summary,\n    }\n"
        code_language: python3
        desc: 補齊相對日期並判斷是否需要追問。
