    - data:
        code: "import json\n\n\ndef _text(value):\n    if value is None:\n       \
          \ return '-'\n    text = str(value).strip()\n    return text if text else\
          \ '-'\n\n\ndef _matches_target(person, target_person):\n    target = _text(target_person)\n\
          \    if target == '-':\n        return True\n    fields = [\n        person.get('employeeName'),\n\
          \        person.get('employeeId'),\n        person.get('department'),\n\
          \    ]\n    return any(target in _text(field) for field in fields)\n\n\n\
          def main(status_code: int, body: str, from_date: str, to_date: str, target_person:\
          \ str) -> dict:\n    raw_json = body if isinstance(body, str) else json.dumps(body,\
          \ ensure_ascii=False)\n\n    try:\n        status = int(status_code)\n \
          \   except Exception:\n        status = 0\n\n    if status != 200:\n   \
          \     return {\n            'summary': f'請假查詢 API 回應失敗（HTTP {status}）。',\n\
          \            'count': 0,\n            'people': [],\n            'raw_json':\
          \ raw_json,\n        }\n\n    try:\n        payload = json.loads(raw_json)\n\
          \    except Exception:\n        return {\n            'summary': '請假查詢 API\
          \ 回傳內容不是有效 JSON。',\n            'count': 0,\n            'people': [],\n\
          \            'raw_json': raw_json,\n        }\n\n    people = payload.get('people')\
          \ or []\n    if not isinstance(people, list):\n        people = []\n\n \
          \   filtered_people = [person for person in people if isinstance(person,\
          \ dict) and _matches_target(person, target_person)]\n    count = len(filtered_people)\n\
          \    truncated = bool(payload.get('truncated'))\n    target_text = _text(target_person)\n\
          \    from_text = _text(from_date or payload.get('from'))\n    to_text =\
          \ _text(to_date or payload.get('to'))\n\n    if not filtered_people:\n \
          \       subject = '同仁' if target_text == '-' else target_text\n        summary\
          \ = f'查詢區間 {from_text} 至 {to_text} 內，沒有找到 {subject} 的請假資料。'\n        if\
          \ truncated:\n            summary += '\\n\\n注意：原始結果可能被截斷，請縮小查詢區間或確認 API\
          \ 限制。'\n        return {\n            'summary': summary,\n            'count':\
          \ count,\n            'people': filtered_people,\n            'raw_json':\
          \ raw_json,\n        }\n\n    lines = [\n        '## 同仁請假查詢結果',\n      \
          \  f'- 查詢區間：{from_text} 至 {to_text}',\n        f'- 查詢對象：{target_text if\
          \ target_text != \"-\" else \"所有同仁\"}',\n        f'- 符合筆數：{count}',\n  \
          \  ]\n    if truncated:\n        lines.append('- 注意：原始結果可能被截斷，請縮小查詢區間或確認\
          \ API 限制。')\n\n    lines.extend([\n        '',\n        '| 姓名 | 部門 | 假別\
          \ | 起始 | 結束 | 狀態 |',\n        '|---|---|---|---|---|---|',\n    ])\n\n \
          \   for person in filtered_people:\n        lines.append(\n            '|\
          \ {name} | {department} | {leave_type} | {start} | {end} | {status} |'.format(\n\
          \                name=_text(person.get('employeeName')),\n             \
          \   department=_text(person.get('department')),\n                leave_type=_text(person.get('leaveType')),\n\
          \                start=_text(person.get('start')),\n                end=_text(person.get('end')),\n\
          \                status=_text(person.get('status')),\n            )\n  \
          \      )\n\n    return {\n        'summary': '\\n'.join(lines),\n      \
          \  'count': count,\n        'people': filtered_people,\n        'raw_json':\
          \ raw_json,\n    }\n"
        code_language: python3
        desc: 將 API 回傳 JSON 轉成中文摘要，並依姓名/部門/員編篩選。
